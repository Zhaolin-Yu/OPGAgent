# Agent_v3 配置文件

# ====================
# LLM 配置
# ====================
llm:
  provider: openai  # qwen 或 openai
  model: gpt-5.2   # 支持多模态的模型
  temperature: 0.7
  max_tokens: 8192

# ====================
# ReAct 配置
# ====================
react:
  max_iterations: 15  # 最大迭代次数
  stop_on_error: false  # 遇到错误时是否停止

# ====================
# 工具配置
# ====================
tools:
  config_path: "src/opgagent/config/tools_config.yaml"  # 工具配置文件路径

# ====================
# Memory 配置
# ====================
memory:
  enable_cache: true  # 是否启用缓存
  cache_ttl: 3600  # 缓存有效期（秒）
