# Agent_v3 配置文件 - Gemini 3 Flash 主模型（Answer 模式 / 评测用）
# 使用方式: --config src/opgagent/config/agent_config_gemini.yaml

# ====================
# LLM 配置
# ====================
llm:
  provider: gemini
  model: gemini-3-flash-preview
  temperature: 0.1
  max_tokens: 65536  # 不限制时使用模型最大值 65536

# ====================
# ReAct 配置
# ====================
react:
  max_iterations: 15
  stop_on_error: false

# ====================
# 工具配置
# ====================
tools:
  config_path: "src/opgagent/config/tools_config.yaml"

# ====================
# Memory 配置
# ====================
memory:
  enable_cache: true
  cache_ttl: 3600
